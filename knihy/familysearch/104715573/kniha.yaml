obsah: "snímek = číslo snímku v prohlížeči FamilySearch (v adrese ?i= o 1 menší); 261 snímků; sn. 2 přední deska s nápisem „Dominical Grundbuch … de Anno 1810“; souvislé zápisy (kupní smlouvy, Einantwortungs-Urkunden, Ab- und Abtretungs-Contracte) s foliem v horním rohu (sn. 55R = fol. 96, sn. 68R = fol. 122, sn. 136 = fol. 254/255, sn. 183 = fol. 348/349, sn. 185 = fol. 352/353); abecední rejstřík s jezdci písmen kolem sn. 233–255 (B na sn. 235R); kniha, na kterou B04888 (DGS 104818118) odkazuje jako „Lit. B“"
