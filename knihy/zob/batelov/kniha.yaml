nazev: "Židovský hřbitov Batelov – fotodokumentace náhrobků „Batelov Steinová 2012“ (Židovská obec Brno)"
url: "https://cemeteries.zob.cz/batelov"
roky: "1748?–1935"
obsah: "náhrobky židovského hřbitova v Batelově, asi 420 kamenů; snímek = číslo hrobu podle plánku hřbitova (batelov.pdf na stránce hřbitova), kameny ve složkách bez čísla hrobu podle názvu fotky (IMG_xxxx, první fotka kamene); odkaz = fotka kamene v Google Drive ŽO Brno; datum = den úmrtí převedený z hebrejského data (hebrejské datum doslovně v ostatni), u neúplného data jen rok nebo rozsah let; osoby doslovně, jak stojí na kameni, přepis jmen latinkou v ostatni; nečitelné kameny a celkové pohledy bez řádku: 015, 034, 047, 066, 069, 131, 208, 218, 225-227, 237, 251, 269, 279, 415, IMG_0101, IMG_0151, IMG_0155, IMG_0163, IMG_0180, IMG_0199, IMG_0205, IMG_0206, IMG_0230, IMG_0234, IMG_0245, IMG_0246, IMG_0267, IMG_0277, IMG_0279, IMG_0284, IMG_0293, IMG_0307, IMG_0308, IMG_0577, IMG_0586, IMG_0591, IMG_0593, IMG_0631, IMG_0632, IMG_0700, IMG_1006, IMG_1007, IMG_1009, IMG_1033, IMG_1037"
poznamka: "čteno očima z fotek ŽO Brno při práci na rodokmenu (2026-11-18 až 19): nejdřív v náhledu, staré kameny bez přečteného roku pak z originálů v plném rozlišení; většina starých kamenů z hrubé žuly je zvětralá, proto u mnoha řádků jen část nápisu a nízká jistota; přečtené jsou i kameny z 2. pol. 19. a z 20. století s německými nápisy"
