obsah: "snímek = číslo snímku na portálu; Farnost Okrouhlice (Okrouhlice, Struhařov, Jezero, Věřice, Střížkov, Petroupim aj.), chronologicky, dvojstrana na snímek (sn. ≈ fol./2 + 2,5: fol. 32–33 = sn. 19, fol. 48–49 = sn. 27, fol. 96–97 = sn. 51); od XI. 1784 po vsích. Zápisy 1752 silně vybledlé. Rejstřík oddaných fary Okrouhlice 13 (matrikaId 10613, P = sn. 31)."
