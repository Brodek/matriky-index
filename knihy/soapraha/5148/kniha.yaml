obsah: "snímek = číslo snímku na portálu; 267 snímků, foliováno; snímek = fol. + 3. Většina knihy po vsích (fol. 119–120 = 1857, fol. 144 = 1853), konec chronologicky (fol. 237 = II–III 1860, fol. 239 = IV–V 1860). Oddací zápisy citují „mat. V str. N“ = fol. N."
