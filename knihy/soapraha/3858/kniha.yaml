nazev: "Benešov 18, kniha zemřelých farnosti Benešov 1779–1838"
farnost: "Benešov"
roky: "1779–1838"
obsah: "snímek = číslo snímku na portálu; Farnost Benešov, asi 570 snímků, 286 listů (snímek ≈ 2 × list, strany listu na dvou snímcích). Město v první části (list 103 = 1806, list 160 = 1828/29, list 174 = 1832), od listu ~176 oddíly vsí; pokračování oddílů 1829–1838 na volných listech: Budkov list 194, Ves Dlouhé Pole list 195–196 (sn. 397–399, VI. 1829 – 1838). Oddíly vsí 1784–1829: Bedrč list 207 (sn. 420), Myslíč 220 (sn. 440), Ves Dlouhé Pole 226–233v (sn. 452–467), Konopiště 240–245 (sn. 480–490), Skalice 284–285 (sn. 565–567). Rejstříky Benešov 35 (id 3879, 1776–1812) a 38 (id 3882, 1813–1852)."
