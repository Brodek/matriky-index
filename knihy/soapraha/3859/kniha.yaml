nazev: "Benešov 19, kniha zemřelých farnosti Benešov 1839–1852"
farnost: "Benešov"
roky: "1839–1852"
obsah: "snímek = číslo snímku na portálu; Farnost Benešov, 386 snímků. Město v první části (list 80 = sn. 170, leden 1848; snímek ≈ 2 × list + 10, strany listu na dvou snímcích), dále oddíly vsí (Dlouhé Pole list 162v–163 = sn. 309–310, Konopiště a Myslíč kolem sn. 336). Rejstřík Benešov 38 (id 3882, 1813–1852; písmeno D sn. 16–18)."
