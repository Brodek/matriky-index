obsah: "snímek = číslo snímku na portálu; Farnost Benešov, 373 snímků. Město v první části (sn. 100 = 1840, sn. 120 = 1841, list „Pag.“ ≈ snímek − 3), prázdné listy kolem sn. 258–260, pak oddíly vsí: Ves Dlouhé Pole sn. 261–265 (Pag. 269–272, 1832–1837), Konopiště kolem sn. 280–300, Myslíč sn. 318, Podhájí sn. 340. Zápisy uvádějí u otce i matky jejich rodiče."
