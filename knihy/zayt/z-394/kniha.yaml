poznamka: "zápisy přečtené při práci na rodokmenu: celý duplikát 1863–1864 (sn. 4L), roky 1874–1891 prohlédnuté v rejstřících a stranách zápisů, přečtené jen zápisy Spitz a Strausky; 1892–1944 jen přehled stavby"
