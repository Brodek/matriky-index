nazev: "inv. č. 394 (Habry, Z 1863–1873, 1874–1944)"
obsah: "snímek = číslo snímku na portálu; fol. = kroužkovaná foliace tužkou. Sn. 1 přední deska, sn. 2 předsádka se štítkem HBMa 394; sn. 3R fol. 1 titul „Mat. Bezirk Habern – Hauptmannschaft Časlau / Duplikate der in der Sterbematrikel Bd. I seit 10. Juni 1863 – Ende 1873 im Haberer Synagogen-Bezirke eingetragenen Sterbefälle“; sn. 4L (fol. 1v) jediná strana zápisů duplikátu: 2. 7. 1863 – 15. 6. 1864, posty 1863: 7, 8, 10, 11 a 1864: 3, 4, 5, 8, vyplněné jen sloupce 1–5; sn. 4R protější strana se sloupci 6–12 prázdná a bez folia, sn. 5L její rub prázdný; fol. 2–15 (zbytek 1864–1873) ve skenu nejsou, po tomto listu následuje přímo fol. 16. Od 1874 každý rok titul / zápisy / rejstřík, titul roku R = fol. 16 + 3·(R−1874): 1874 sn. 5R / 6 / 7R (sn. 8 rub a prázdný list), 1875 sn. 9R / 10 / 11R, 1876 sn. 12R / 13 / 14R, 1877 sn. 15R / 16 / 17R, 1878 sn. 18R / 19 / 20R, 1879 sn. 21R / 22 / 23R, 1880 sn. 24R / 25 / 26R, 1881 sn. 27R / 28 / 29R, 1882 sn. 30R / 31 / 32R, 1883 sn. 33R / 34 / 35R, 1884 sn. 36R / 37 / 38R, 1885 sn. 39R / 40 / 41R, 1886 sn. 42R / 43 / 44R, 1887 sn. 45R / 46 / 47R, 1888 sn. 48R / 49 / 50R, 1889 sn. 51R (prázdný formulář „1889“) / 52 (fol. 61), rejstřík 1889 chybí, 1890 sn. 53R (prázdný formulář „1890 Habern“) / 54 (fol. 62) / 56L (fol. 63, sn. 55R rub téhož lístku), 1891 sn. 56R (prázdný formulář „1891“) / 57 (fol. 64) / 58R (fol. 65); sn. 59R fol. 66 titul „1892–1912 Duplikat Matrika zemřelých“, sn. 60–117 roky 1892–1935 (tiskopisy Liste der Gestorbenen / Seznam zemřelých, od 1913 Matrika zemřelých), sn. 118–133 roky 1936–1944 (tituly Totenmatrik – Matrika zemřelých 1941, 1942, 1944), sn. 134 prázdná strana, sn. 135 zadní deska. Duplikát obsahuje jen část postů původní matriky (např. 1874 posty 1, 2, 3, 5, 7, 12, 13)."
