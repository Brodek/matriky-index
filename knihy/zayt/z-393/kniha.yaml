nazev: "inv. č. 393 (Habry, Z 1791–1839)"
obsah: "snímek = číslo snímku na portálu; sn. 1 desky „Sterbematrik I.“, sn. 2 štítek HBMa 393; sn. 3–8 první vrstva formulářů (Pag. 1–11, liché strany); hlavní řada „Sterbregister“ stránkovaná znovu od 1: sn. 9 = str. 1–2, obecně snímek N = str. 2(N−9)+1 vlevo a 2(N−9)+2 vpravo (sn. 9L 1791–1798, 9R 1799–1802, 10L 1805–1807, 10R 1807–1810, 11R 1811–1812, 12L 1813–1816, 12R 1816–1817, 13L 1818–1819, 14R 1823–1825, 15L 1825–1826, 16L 1828–1829, 16R 1830–1832, 17L 1832–1834, 17R 1834–1835, 19L 1838–1839); jmenný rejstřík na sn. 26–35 (odkazuje na strany hlavní řady; S na sn. 34L), sn. 36 závěrečná doložka s pečetí, sn. 37 zadní deska"
url: "https://zayt.org/collections/jewish-registers-1784-1949/z-393"
poznamka: "zápisy přečtené při práci na rodokmenu; jen vybrané zápisy, ne celá kniha"
