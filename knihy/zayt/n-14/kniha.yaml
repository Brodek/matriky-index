archiv: "zayt"
kniha: "n-14"
nazev: "inv. č. 14 (Batelov, N 1788–1846)"
obsah: "snímek = číslo snímku na portálu; sn. 1 přední deska (štítek Batelov 1788–1846), sn. 2 předsádka se štítkem HBMa 14; „Geburts und Beschneidungsbuch von der Judengemeinde Battelau“: každá dvojstrana je jedno folio (snímek N = fol. N−2), vlevo Jahr, Monat, Tag, jméno dítěte, pohlaví, otec, matka, příjmení, dům, vpravo kmotr (Gevatter) a mohel (Beschneider) – vyplněno jen u chlapců; sn. 3 = fol. 1 1788–1790, sn. 4 = fol. 2 1790–1795, sn. 5 = fol. 3 1795–1800, sn. 6 = fol. 4 1801–1804, sn. 7 = fol. 5 1805–1810, dále do sn. 14 a sn. 30; pozdní jmenný rejstřík tužkou (Name – fol, příjmení a pod ním křestní jména) na sn. 15–29, B na sn. 16R; v rejstříku jsou pod „Bauer“ i jiné podoby (Präuer/Bräuer)"
url: "https://zayt.org/collections/jewish-registers-1784-1949/n-14"
poznamka: "zápisy přečtené při práci na rodokmenu (rodina Bauer); podrobně jen fol. 1–5 (1788–1810), zápisy Bauer"
