obsah: "„Jüdische Controllmatrik der Gestorbenen Israeliten von Raubowitz“ (štítek na deskách): jen Hroubovice; snímek 3 titulní list, 4–51 zápisy (sn. 4 = pag. 1), 52 závěrečná doložka s pečetí; post = post svazku Raubowitzer Sterbe III (rejstřík oz-531), od 1863 číslování po rocích; tištěný formulář vodorovně; sn. 3–11 (1840–1847) jméno a vztahy (sl. 5) vodorovně, data svisle; od sn. 12 (1848+) zápisy převážně svisle"
