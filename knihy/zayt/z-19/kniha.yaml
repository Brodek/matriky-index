kniha: "z-19"
nazev: "inv. č. 19 (Batelov, Z 1788–1846)"
obsah: "snímek = číslo snímku na portálu; sn. 1 přední deska („Sterbe-Matrik Battelau 1788–1846“), sn. 2 předsádka se štítkem HBMa 19, sn. 3L prázdná, sn. 3R = fol. 1 (titul „Sterb Buch … von der Gemeinde Battellau zur Herrschaft Battellau gehörig“); dále snímek N: vlevo fol. 2(N−4)+2, vpravo 2(N−4)+3 (sn. 4 = fol. 2–3, 1794–1803; sn. 5 = fol. 4–5, 1804–1813; sn. 6 = fol. 6–7, 1814–1818; sn. 7 = fol. 8 prázdná a fol. 9, 1820–1823 – zápisy od července 1818 do března 1820 chybějí; sn. 8 = fol. 10–11, 1823–1829; sn. 9 = fol. 12–13, 1829–1836; sn. 10 = fol. 14–15, 1836–1843; sn. 11L = fol. 16, 1843–1846); sn. 11R a 12 prázdné; pozdní jmenný rejstřík tužkou (Namen – fol) na sn. 13R–28, B na sn. 14R; rejstřík je neúplný (chybí např. Adam Bauer 1814 na fol. 6); sn. 29 zadní deska"
url: "https://zayt.org/collections/jewish-registers-1784-1949/z-19"
poznamka: "zápisy přečtené při práci na rodokmenu (rodina Bauer); kniha prohlédnuta celá ve sloupci jmen, podrobně jen zápisy Bauer"
