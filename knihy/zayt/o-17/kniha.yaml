kniha: "o-17"
nazev: "inv. č. 17 (Batelov, O 1788–1846)"
obsah: "snímek = číslo snímku na portálu; sn. 1–2 desky a předsádka, sn. 3R = fol. 1 (titul „Trauungsbuch … der Jüdischen Gemeinde Battellau“, Iglauer Kreis) s jediným sňatkem 1788; dále snímek N: vlevo fol. 2(N−3), vpravo fol. 2(N−3)+1 (sn. 4 = fol. 2–3 1788–1794, sn. 5 = fol. 4–5 1795–1811, sn. 6 = fol. 6–7 1812–1832, sn. 7 = fol. 8–9 1835–1846); sn. 8 prázdné listy; pozdní jmenný rejstřík tužkou podle ženicha (Bräutigam – Braut – fol) na sn. 9–22, každé písmeno na vlastním listu (B na sn. 10R); rejstřík je neúplný (např. chybí sňatek Strausky–Bauer 1788 na fol. 2). Celkem asi 33 sňatků."
url: "https://zayt.org/collections/jewish-registers-1784-1949/o-17"
poznamka: "zápisy přečtené při práci na rodokmenu (rodina Bauer); jen vybrané zápisy, ostatní sňatky prohlédnuty ve sloupci jmen"
