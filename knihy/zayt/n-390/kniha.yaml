nazev: "inv. č. 390 (Habry, N 1790–1839)"
obsah: "snímek = číslo snímku na portálu; dvě vrstvy: (a) původní zápisy bez folií, chronologicky, sn. asi 4–15 (sn. 5R 1791, 7 1792–1793, 8 1799–1801, 9R 1806–1807, 10L 1809, 11 1810–1813, 12L 1812–1813, 13L 1814, 14L 1816); (b) čistopis „Geburtsbuch“ stránkovaný 1–53: sn. 16R = str. 1 (dodatky 1770–1791), dále strana 2(N−16) vlevo a 2(N−16)+1 vpravo na snímku N (sn. 17 str. 2–3 1791–1794, 19 str. 6–7 1800–1802, 22 str. 12–13 1807–1808, 23 str. 14–15 1809–1810, 26 str. 20–21 1812–1813, 28 str. 24–25 1816, 30 str. 28–29 1817–1818, 33 str. 34–35 1820–1821, 36 str. 40–41 1823–1824, 40 str. 48–49 1829–1830, 41 str. 50–51 1831–1832, 42 str. 52–53 1833–1834); sn. 16L dodatečné zápisy 1819 a jeden zápis 178?; jmenný rejstřík k čistopisu na konci (S na sn. 59L), odkazuje na strany čistopisu"
