obsah: "sn. 1–2 desky a štítek „Geburtsbuch … Münchengrätz 1820–1838“; sn. 3 = Pag. 1 (prosinec 1820), dál dvojstrany chronologicky (sn. 4 = Pag. 2–3, 1821–1822; sn. 5 = Pag. 4–5, 1822; sn. 10L = Pag. 14, konec r. 1828); příjmení Hann (v o-517 psáno Hahn); sn. 25 závěrečná doložka (rabinát Münchengrätz, Weißwasser, Hühnerwasser, Niemes, Böhm. Aicha, Gabel, Hirschberg, Neuperstein, Mladiegow); sn. 26–27 prázdné; na sn. 2–3 a 25–27 rejstřík není (titul archivu uvádí „(i)“)"
