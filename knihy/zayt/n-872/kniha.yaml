nazev: "Kostelec nad Černými lesy, židovská matrika N 1841–1859 (NA HBMa inv. 872)"
farnost: "Kostelec nad Černými lesy (rabinát; oddíly podle obcí – Konojedy, Planian, Schwarzkosteletz, Swojschitz aj.)"
roky: "1841–1859"
obsah: "zápisy sn. 4–64 po oddílech obcí (záhlaví nahoře na pravé straně), oddíl Swojschitz sn. 61 (posty 21–27, 1855–1857) a pokračování fol. 44 = sn. 49 (posty 27–29, 1858–1859); rejstřík podle křestních jmen (Seite/Post) sn. 65–83; sn. 84 závěrečná doložka s pečetí; Seite v rejstříku = snímek − 5 (Seite 44 = sn. 49, 47 = sn. 52), Alois „55/26“ je ale na sn. 61; sn. 52 má přes stránku průsvitnou fólii"
