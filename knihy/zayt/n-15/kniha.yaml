nazev: "inv. č. 15 (Batelov, N 1789–1845)"
obsah: "snímek = číslo snímku na portálu; sn. 1 přední deska, sn. 2 předsádka se štítkem HBMa 15, sn. 3–13 zápisy (příčný formát, poškozeno vlhkostí), sn. 14 prázdné listy, sn. 15 zadní deska; souběžná řada (duplikát) ke knize n-14 se stejnými sloupci (otec, matka, příjmení, dům, kmotr, mohel), bez údajů o prarodičích"
