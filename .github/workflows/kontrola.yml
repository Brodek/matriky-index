name: Kontrola dat
on:
  pull_request:
    paths: ["knihy/**", "tools/kontrola.py"]
  push:
    branches: [main]
    paths: ["knihy/**", "tools/kontrola.py"]
jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Změny v pull requestu
        if: github.event_name == 'pull_request'
        run: python tools/kontrola.py --zmeny origin/${{ github.base_ref }}
      - name: Celý index
        if: github.event_name == 'push'
        run: python tools/kontrola.py
